name: workers-quota

# Watches the account's Cloudflare Workers requests against the free
# plan's 100,000 a day and fails at 70%, so GitHub emails while there is
# still time to act. See scripts/workers_quota.py for what running out
# does and which token it needs (repository secret
# CLOUDFLARE_ANALYTICS_TOKEN, Account Analytics: Read only).

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/workers_quota.py
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
