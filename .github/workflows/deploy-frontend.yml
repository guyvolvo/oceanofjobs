name: deploy-frontend

# Ships frontend/ to S3 without a full Terraform apply, same split as
# deploy-api.yml. --delete mirrors frontend/ exactly, removing files
# dropped from it too. The CloudFront invalidation is what makes a push
# actually visible, since the frontend path caches far longer than /api/*.

on:
  push:
    branches: [main]
    paths: ["frontend/**", "docs/**", "apply/**"]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: il-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.FRONTEND_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # The docs at /docs: a Next.js static export (docs/), built before
      # anything is uploaded so a failed build stops the deploy whole. The
      # API reference is generated from the live /api/openapi.json here.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            apply/package-lock.json

      - name: Build the docs
        working-directory: docs
        run: npm ci && npm run build

      # The auto apply dashboard at /apply: a Vite + React app (apply/),
      # built here for the same reason as the docs, so a failed build
      # stops the deploy before anything is uploaded.
      - name: Build the auto apply dashboard
        working-directory: apply
        run: npm ci && npm run build

      - name: Stamp asset URLs with the commit
        run: |
          # Cloudflare does not pass our no-cache through for .js and
          # .css. It rewrites them to max-age=14400, so a browser keeps
          # the old app.js or stats.js for four hours after a deploy
          # while the HTML (not cached by Cloudflare) is already new.
          # Seen live (2026-09-10): new stats.html running the previous
          # stats.js, which threw on a button that no longer existed and
          # left the page half-wired. A query string the browser has
          # never seen is a new URL to it, so every deploy's HTML points
          # at fresh copies. Only local scripts and stylesheets: anything
          # with a scheme (the support widget's CDN script) is left alone.
          v=${GITHUB_SHA::8}
          # The dashboard's page loads /auth.js from frontend/, so it is
          # stamped too; its own bundles are already content-hashed.
          sed -i -E "s#(src|href)=\"([^\":]+\.(js|css))\"#\1=\"\2?v=$v\"#g" frontend/*.html apply/dist/index.html
          grep -n '?v=' frontend/*.html apply/dist/index.html

      - name: Sync frontend/ to S3
        run: |
          # --cache-control "no-cache": NOT no-store -- browsers still
          # keep a local copy, they just always send a conditional
          # request (If-None-Match, using S3's own ETag) before using
          # it. Confirmed live (2026-09-08): every asset here was being
          # served with no Cache-Control at all, so a repeat visit's
          # caching behavior was left to each browser's own unreliable
          # heuristic (roughly 10% of the file's Last-Modified age --
          # near-zero right after a deploy, meaning a full re-download
          # anyway). This header reaches the browser for HTML only;
          # scripts and stylesheets get Cloudflare's four-hour TTL
          # instead, which is why the step above stamps their URLs.
          # --exclude for everything the applier publishes rather than
          # this repo, since --delete would wipe them on every unrelated
          # CSS or JS deploy. bootstrap.json was excluded from the start.
          # stats.json and facets.json were not, and until this was
          # noticed each frontend deploy deleted both and sent every poll
          # back through the Lambda until the next precompute. Not an
          # outage, the page falls back to the API, but exactly the cost
          # those files exist to avoid. bootstrap-il.json joined
          # the list the day it was added, for the same reason.
          aws s3 sync frontend/ "s3://${{ vars.FRONTEND_BUCKET }}/" --delete \
            --exclude "bootstrap.json" \
            --exclude "bootstrap-il.json" \
            --exclude "sitemap.xml" \
            --exclude "sitemap-*.xml" \
            --exclude "feed.xml" \
            --exclude "stats.json" \
            --exclude "facets.json" \
            --exclude "hot.json" \
            --exclude "explore.json" \
            --exclude "explore/*" \
            --exclude "companies/*" \
            --exclude "media/*" \
            --exclude "docs/*" \
            --exclude "apply/*" \
            --cache-control "no-cache"

      # Its own prefix; the frontend sync excludes docs/* so its --delete
      # leaves these alone.
      - name: Sync the docs to S3
        run: |
          aws s3 sync docs/out/ "s3://${{ vars.FRONTEND_BUCKET }}/docs/" --delete \
            --cache-control "no-cache"

      # Same arrangement as the docs: its own prefix, excluded from the
      # frontend sync above.
      - name: Sync the auto apply dashboard to S3
        run: |
          aws s3 sync apply/dist/ "s3://${{ vars.FRONTEND_BUCKET }}/apply/" --delete \
            --cache-control "no-cache"

      - name: Mark 404.html for a real 404 status
        run: |
          # infra/cloudfront.tf's not_found_status function turns this
          # metadata header into a 404 status for the not-found page. The
          # sync above uploads the file without it, so this runs after.
          aws s3 cp frontend/404.html "s3://${{ vars.FRONTEND_BUCKET }}/404.html" \
            --metadata otj-status=404 \
            --content-type "text/html; charset=utf-8" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
