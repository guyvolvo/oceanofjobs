<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <!-- Google tag (gtag.js). Google's own instruction is "immediately
       after <head>"; it sits after the charset instead, because a
       document's encoding has to be declared inside the first 1024
       bytes and this snippet is long enough to push it out. async, so
       it never blocks the theme script below or first paint. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GXP63R1JP1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GXP63R1JP1');
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tech Job Board | Ocean of Jobs</title>
  <meta name="description" content="OceanOfJobs.com: the open-source job board that makes hunting for your next opportunity easy, fast, and transparent." />
  <!-- A link shared without these falls back to whatever a platform's own
       crawler screenshots live -- reported live (2026-09-08): that's a
       JS-rendered page mid-fetch, so the preview showed the loading
       skeleton ("Loading market panels...") instead of anything real.
       og.jpg is a static card (the name and the day's counts over a
       blurred photograph, rendered once a day by og-image.yml), so
       every platform shows the same correct thing regardless of whether
       or how well its crawler executes JS. Absolute URLs throughout --
       a relative image path doesn't resolve for an external crawler. -->
  <!-- The board is one page; a listing open on it has its own page at
       /job/<id>, which app.js swaps in here while one is open, so the
       two never compete in an index. -->
  <link rel="canonical" href="https://oceanofjobs.com/board" id="canonical" />
  <link rel="alternate" type="application/rss+xml" title="Ocean of Jobs newest listings" href="https://oceanofjobs.com/feed.xml" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://oceanofjobs.com/board" />
  <meta property="og:title" content="OceanOfJobs.com" />
  <meta property="og:description" content="The open-source job board that makes hunting for your next opportunity easy, fast, and transparent." />
  <meta property="og:image" content="https://oceanofjobs.com/og.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="OceanOfJobs.com" />
  <meta name="twitter:description" content="The open-source job board that makes hunting for your next opportunity easy, fast, and transparent." />
  <meta name="twitter:image" content="https://oceanofjobs.com/og.jpg" />
  <!-- SVG first (crisp at any size, modern browsers use it over the .ico
       below); .ico stays for older browsers that don't support rel="icon"
       type="image/svg+xml" at all. apple-touch-icon is PNG-only -- iOS
       doesn't accept SVG there. favicon.svg wraps the actual provided
       mark (favicon-512.png) as a base64 <image>, not a redrawn
       approximation -- the 16/32/180px PNGs and the .ico are resized
       directly from that same source file too. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=3" />
  <link rel="icon" href="favicon.ico?v=3" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png?v=3" />
  <link rel="stylesheet" href="style.css" />
  <!-- The default first page, precomputed at merge time and served from
       CloudFront's edge with no Lambda in the path (loader/bootstrap.py).
       Preloaded so it downloads alongside app.js rather than after it.
       app.js ignores it unless it matches the exact query it was about
       to make, so a mismatched file costs nothing but a normal fetch. -->
  <link rel="preload" href="/bootstrap.json" as="fetch" crossorigin="anonymous" />
  <script>
    // Applied before first paint so there's no flash of the wrong theme
    // on reload. app.js still owns the toggle button/click handling.
    if (localStorage.getItem("iljobs_theme") === "dark") {
      document.documentElement.setAttribute("data-theme", "dark");
    }
    // Same for a Statistics column collapsed on an earlier visit (see
    // wireStatsToggle in app.js), so it does not open and ease shut.
    try {
      if (localStorage.getItem("iljobs_stats_collapsed") === "1") {
        document.documentElement.classList.add("stats-collapsed");
      }
    } catch (e) {}
  </script>
</head>
<body class="board-page">

  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <symbol id="status-positive" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M7.7 12.3 10.7 15.3 16.4 9" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
    <!-- Signed-in account. Drawn here rather than shipped as an image
         for the same reason the status marks are: one stroke weight, one
         colour that follows the text it sits beside, and it stays sharp
         at any size. The head sits clear of the shoulders and both stay
         inside the ring, so it reads at the 18px the topbar gives it. -->
    <symbol id="account" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <circle cx="12" cy="9.2" r="2.9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M6.7 19.1a5.3 5.3 0 0 1 10.6 0" fill="none" stroke="currentColor"
            stroke-width="2" stroke-linecap="round"/>
    </symbol>
    <symbol id="status-warning" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 7.4v5.4" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round"/>
      <circle cx="12" cy="16.4" r="1.15" fill="currentColor"/>
    </symbol>
    <symbol id="status-negative" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M9 9l6 6M15 9l-6 6" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round"/>
    </symbol>
    <!-- Updating: the same ring, faint, with one quarter drawn solid. CSS
         spins the whole mark (see .status-icon.updating). -->
    <symbol id="status-updating" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2" opacity="0.25"/>
      <path d="M12 3a9 9 0 0 1 9 9" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round"/>
    </symbol>
  </svg>

  <!-- The board is a sidebar and a main column. The sidebar holds what
       is about the site and about the reader (where else to go, which
       listings, which categories); the main column holds the search,
       the filters as a row of pills, and the two boxes: the list, and
       the open listing or, with nothing open, what the filters add up
       to. Below 1100px the sidebar is a drawer behind the menu button
       and the pane is a sheet; below 800px the pills' lists are sheets
       too, and the boxes run edge to edge. -->
  <div class="board-shell">
    <aside class="site-side" id="site-side" aria-label="Site">
      <div class="side-brand-row">
        <a class="side-brand" href="/"><img src="/favicon.svg?v=3" width="22" height="22" alt="" /><span>oceanofjobs.com</span></a>
        <button type="button" class="side-fold" id="side-fold" aria-label="Collapse the sidebar" aria-expanded="true" title="Collapse">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
        </button>
      </div>
      <nav class="side-group side-nav" aria-label="Site"><a href="/board" class="current" aria-current="page" title="Jobs"><svg viewBox="0 -960 960 960" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M160-120q-33 0-56.5-23.5T80-200v-440q0-33 23.5-56.5T160-720h160v-80q0-33 23.5-56.5T400-880h160q33 0 56.5 23.5T640-800v80h160q33 0 56.5 23.5T880-640v440q0 33-23.5 56.5T800-120H160Zm0-80h640v-440H160v440Zm240-520h160v-80H400v80ZM160-200v-440 440Z"/></svg><span>Jobs</span></a><a href="/companies" title="Companies"><svg viewBox="0 -960 960 960" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M80-120v-720h400v160h400v560H80Zm80-80h240v-80H160v80Zm0-160h240v-80H160v80Zm0-160h240v-80H160v80Zm0-160h240v-80H160v80Zm320 480h320v-400H480v400Zm80-240v-80h160v80H560Zm0 160v-80h160v80H560Z"/></svg><span>Companies</span></a><a href="/stats" title="Statistics"><svg viewBox="0 -960 960 960" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="m140-220-60-60 300-300 160 160 284-320 56 56-340 384-160-160-240 240Z"/></svg><span>Statistics</span></a><a href="/api/help" title="API"><svg viewBox="0 -960 960 960" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M320-240 80-480l240-240 57 57-184 184 183 183-56 56Zm320 0-57-57 184-184-183-183 56-56 240 240-240 240Z"/></svg><span>API</span></a></nav>
      <!-- Which listings the board shows. Filters apply in every view:
           Best matches orders what they leave, it does not replace them. -->
      <div class="side-group view-switch" id="view-switch" role="tablist" aria-label="Which listings to show">
        <button type="button" class="seg-btn active" data-view="tech" role="tab" aria-selected="true">Tech roles</button>
        <button type="button" class="seg-btn" data-view="all" role="tab" aria-selected="false">All roles</button>
        <button type="button" class="seg-btn" data-view="matches" role="tab" aria-selected="false">Best matches</button>
        <button type="button" class="seg-btn" data-view="saved" role="tab" aria-selected="false">Saved</button>
      </div>
      <!-- The category filter, as a list with counts: the one filter a
           reader sets first and leaves set. Drawn by renderSideCategories
           from the same rows as the rail's own (hidden) category group. -->
      <div class="side-group side-section">
        <div class="side-title">Categories</div>
        <div class="side-cats" id="side-cats"></div>
      </div>
      <!-- Searches kept in this browser (wireSavedSearches), each with
           how many roles were posted since it was last opened. -->
      <div class="side-group side-section">
        <div class="side-title">Saved searches</div>
        <div class="side-cats" id="side-saved"></div>
        <button type="button" class="side-cat side-save" id="side-save" hidden>+ Save this search</button>
      </div>
      <div class="side-foot">
        <!-- Sign-in and the theme switch live here on a phone, where the
             header has no room for them (wireSideBar). -->
        <div class="side-account" id="side-account"></div>
        <a class="side-source" href="https://github.com/guyvolvo/oceanofjobs" target="_blank" rel="noopener">Source code</a>
      </div>
    </aside>
    <div class="side-scrim" id="side-scrim" aria-hidden="true"></div>

    <div class="board-main">
      <div class="board-head">
        <button type="button" class="side-open" id="side-open" aria-label="Menu" aria-expanded="false" aria-controls="site-side"><span aria-hidden="true"><i></i><i></i><i></i></span></button>
  <div class="topbar-search" id="topbar-search" role="search">
    <svg class="topbar-search-icon" viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
      <circle cx="7" cy="7" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/>
      <path d="M10.6 10.6 14 14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
    <input type="text" id="f-search" autocomplete="off" aria-label="Search jobs" placeholder="Search jobs, companies, skills, or locations" title="Every word must appear somewhere in the listing: title, company, location, category or description. &quot;Quote a phrase&quot; to keep it together." />
      <button type="button" class="topbar-search-clear" id="f-search-clear" aria-label="Clear search" hidden>
      <svg viewBox="0 0 10 10" width="10" height="10" aria-hidden="true">
        <path d="M2 2l6 6M8 2l-6 6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
        <div class="board-corner">
          <!-- Populated entirely by app.js's renderAuthState() -->
          <div class="auth-area" id="auth-area"></div>
          <button type="button" class="theme-toggle" id="theme-toggle" role="switch" aria-checked="false" aria-label="Dark mode"><span class="theme-knob" aria-hidden="true"></span><svg class="theme-ico theme-ico-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg><svg class="theme-ico theme-ico-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></button>
        </div>
      </div>

      <!-- Every filter that narrows by a value, with its counts, as a
           row of pills. Each pill is one rail section (renderFilterRail)
           and opens its list under it. -->
      <div class="board-pills">
        <aside class="filter-rail" id="filter-rail" aria-label="Filters">
          <div class="rail-groups" id="rail-groups"></div>
        </aside>
        <button type="button" class="rail-reset" id="f-reset" hidden>Reset</button>
      </div>

      <!-- Best matches only: the CV skills the order is built from.
           A ranked board looks like an unranked one, so this is the
           only thing on screen saying what the order means. -->
      <div class="match-panel" id="match-panel" hidden></div>
      <!-- What the search did that the result count cannot say:
           words past the ten-word cap, or an any-word search. -->
      <div id="search-notice" class="search-notice" hidden></div>
      <!-- app.js still draws one chip per active value here; the pills
           say the same thing, so the row is not shown. -->
      <div class="active-chips" id="active-chips" hidden></div>

      <div class="board-grid">
        <div class="board-box board-box-main">
      <div class="board-list">
        <div class="col-head list-head">
          <div class="list-head-text">
            <span class="col-head-title" id="result-count"></span>
            <span class="col-head-sub" id="result-sub"></span>
          </div>
          <!-- The two controls that bound and order the whole result
               set, at the right of the count they change. -->
          <div class="topbar-sorts">
            <select id="f-date-posted" title="Date posted">
            <option value="">Any date</option>
            <option value="any" hidden>Any time</option>
            <option value="1">Past 24 hours</option>
            <option value="3">Past 3 days</option>
            <option value="7">Past 7 days</option>
            <option value="14">Past 14 days</option>
            <option value="30">Past 30 days</option>
          </select>
            <span class="sort-wrap"><span class="sort-label">Sort</span><select id="f-sort" title="Sort">
            <option value="">Sort</option>
            <option value="match:asc" hidden>Best match</option>
            <!-- Relevance ranks by where the search words appear
                 (see relevance_score_sql). Newest stays the default:
                 a job board is read by date first. -->
            <option value="relevance:asc">Relevance</option>
            <option value="age:asc">Newest</option>
            <option value="age:desc">Oldest</option>
          </select></span>
          </div>
        </div>
        <!-- Shown by a background refresh that found new listings while
             the reader was further down the list (see loadJobs). -->
        <div class="new-listings-anchor">
          <button type="button" class="new-listings" id="new-listings" hidden></button>
        </div>

        <!-- Skeleton rows replaced the text loader (see jobsSkeletonHtml
             in app.js); this stays as the screen-reader half of that,
             since the bones themselves are aria-hidden. -->
        <div id="jobs-loading" class="visually-hidden" role="status"></div>
        <div id="jobs-error" class="error-state" style="display:none"></div>
        <div id="jobs-empty" class="empty-state" style="display:none"><strong>No results</strong><span>No listings match these filters.</span></div>

        <!-- The head moved out of the table and into the column head
             above, which is shared with the other two columns. -->
        <table class="jobs">
          <tbody id="jobs-body"></tbody>
        </table>
        <!-- One skeleton row, the real row's own markup with bones in
             it, so it is the real row's height at every width. The
             script stamps sixteen in before app.js has even
             downloaded: on a phone an empty table put the pagination
             inside the first screen, and the fifty rows that
             followed pushed it 9,000px down. Sixteen is more than a
             screen at any width. app.js reads the same template for
             every later skeleton, so there is one row shape. -->
        <template id="skeleton-row">
          <tr class="skeleton-row" aria-hidden="true">
            <td class="star-cell"><span class="skeleton sk-star"></span></td>
            <td class="logo-cell"><span class="skeleton sk-logo company-logo listing"></span></td>
            <td class="main-cell">
              <div class="job-card-title"><span class="skeleton sk-line sk-title"></span></div>
              <div class="job-meta"><span class="skeleton sk-line sk-meta"></span></div>
              <div class="job-where"><span class="skeleton sk-line sk-meta"></span></div>
              <div class="job-chips"><span class="skeleton sk-line sk-chips"></span></div>
            </td>
            <td class="age-cell"><span class="skeleton sk-age"></span></td>
          </tr>
        </template>
        <script>
          (function () {
            var tpl = document.getElementById("skeleton-row"), body = document.getElementById("jobs-body");
            for (var i = 0; i < 16; i++) body.appendChild(tpl.content.cloneNode(true));
            // The skills panel, for a reader whose last visit ranked
            // by CV skills. app.js draws the real one from these same
            // saved filters, in the same shape, so it lands over this
            // instead of pushing the rows down when the script runs.
            try {
              var saved = JSON.parse(localStorage.getItem("iljobs_filters") || "{}");
              var skills = Array.isArray(saved.skills) ? saved.skills : [];
              if (skills.length && !saved.starred_only) {
                var open = localStorage.getItem("iljobs_match_skills_open") === "1";
                // Buttons where the real panel has buttons: a span in
                // their place is 2px shorter and that is a shift too.
                var el = function (tag, cls, text) { var n = document.createElement(tag); n.className = cls; if (text) n.textContent = text; if (tag === "button") { n.type = "button"; n.tabIndex = -1; } return n; };
                var head = el("div", "match-panel-head");
                head.appendChild(el("button", "match-panel-toggle", "My skills " + skills.length));
                head.appendChild(el("span", "match-panel-label", "Ranked by relevance"));
                head.appendChild(el("span", "link match-panel-edit", "Edit skills"));
                var wrap = el("div", "match-skills-wrap" + (open ? " open" : ""));
                var list = el("div", "match-skills");
                for (var k = 0; k < skills.length; k++) list.appendChild(el("button", "match-skill", skills[k] + " ✕"));
                wrap.appendChild(list);
                var panel = document.getElementById("match-panel");
                panel.appendChild(head);
                panel.appendChild(wrap);
                panel.hidden = false;
              }
            } catch (e) {}
          })();
        </script>

        <!-- The list grows as you reach the end of it. The button is
             not a fallback nobody sees: the observer clicks it, so there
             is one path into a load, and it still works on its own if
             the observer never fires. -->
        <div class="jobs-more" id="jobs-more" hidden>
          <button type="button" class="btn ghost" id="jobs-more-btn">Load more</button>
        </div>
      </div>
        </div>

      <aside class="job-detail board-box" id="job-detail" role="complementary" aria-label="Job detail">
        <div class="col-head pane-head" id="pane-head"></div>
        <div class="pane-body" id="pane-body"></div>
        <!-- Apply and Save again, once the real pair has scrolled out of
             the pane. A long description otherwise puts the only way to
             act on a listing several screens above where you finish
             reading it. -->
        <div class="pane-sticky" id="pane-sticky" hidden></div>
      </aside>
      <!-- Dims and catches clicks on the board while the pane is a
           sheet. Inert above 1100px, where the pane is a column. -->
      <div id="job-scrim" aria-hidden="true"></div>
      </div>
    </div>
  </div>
