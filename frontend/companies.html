  <!-- Google tag (gtag.js). Google's own instruction is "immediately
       after <head>"; it sits after the charset instead, because a
       document's encoding has to be declared inside the first 1024
       bytes and this snippet is long enough to push it out. async, so
       it never blocks the theme script below or first paint. -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-GXP63R1JP1"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-GXP63R1JP1');
  </script>

  <title>Companies hiring | Ocean of Jobs</title>

  <!-- A link shared without these falls back to whatever a platform's own
       crawler screenshots live -- reported live (2026-09-08): that's a
       JS-rendered page mid-fetch, so the preview showed the loading
       skeleton ("Loading market panels...") instead of anything real.
       og.jpg is a static card (the name and the day's counts over a
       blurred photograph, rendered once a day by og-image.yml), so
       every platform shows the same correct thing regardless of whether
       or how well its crawler executes JS. Absolute URLs throughout --
       a relative image path doesn't resolve for an external crawler. -->
  <!-- The board is one page; a listing open on it has its own page at
       /job/<id>, which app.js swaps in here while one is open, so the
       two never compete in an index. -->
  <link rel="canonical" href="https://oceanofjobs.com/companies" id="canonical" />
  <link rel="alternate" type="application/rss+xml" title="Ocean of Jobs newest listings" href="https://oceanofjobs.com/feed.xml" />

  <meta property="og:image" content="https://oceanofjobs.com/og.jpg" />
  <meta property="og:image:width" content="1200" />

  <!-- SVG first (crisp at any size, modern browsers use it over the .ico
       below); .ico stays for older browsers that don't support rel="icon"
       type="image/svg+xml" at all. apple-touch-icon is PNG-only -- iOS
       doesn't accept SVG there. favicon.svg wraps the actual provided
       mark (favicon-512.png) as a base64 <image>, not a redrawn
       approximation -- the 16/32/180px PNGs and the .ico are resized
       directly from that same source file too. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=3" />
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=3" />
  <link rel="icon" href="favicon.ico?v=3" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="favicon-180.png?v=3" />
  <link rel="stylesheet" href="style.css" />
  <!-- The default first page, precomputed at merge time and served from
       CloudFront's edge with no Lambda in the path (loader/bootstrap.py).
       Preloaded so it downloads alongside app.js rather than after it.
       app.js ignores it unless it matches the exact query it was about
       to make, so a mismatched file costs nothing but a normal fetch. -->
  <script>
    // Applied before first paint so there's no flash of the wrong theme
    // on reload. app.js still owns the toggle button/click handling.
    if (localStorage.getItem("iljobs_theme") === "dark") {
      document.querySelector('meta[name="theme-color"]').content = "#17181c";
      document.documentElement.setAttribute("data-theme", "dark");
    }
    // Same for a Statistics column collapsed on an earlier visit (see
    // wireStatsToggle in app.js), so it does not open and ease shut.
    try {
      if (localStorage.getItem("iljobs_stats_collapsed") === "1") {
        document.documentElement.classList.add("stats-collapsed");
      }
    } catch (e) {}
  </script>
