        <h1 class="home-h2">Checkout</h1>
        <p id="co-msg" aria-live="polite">Opening checkout…</p>
        <p class="legal-updated"><a href="/pricing">Back to pricing</a></p>
        <p class="legal-updated">Payments are handled by Dodo Payments, our Merchant of Record. See the <a class="link" href="/terms">terms</a> and <a class="link" href="/refunds">refund policy</a>.</p>
        <script>
          // ?plan=basic or ?plan=pro: our API makes a Dodo checkout for the
          // signed-in account (api/dodo.py) and this page goes there.
          // ?manage=1: the same for Dodo's customer portal.
          // After the page, because auth.js loads at the end of it.
          document.addEventListener("DOMContentLoaded", async function () {
            var msg = document.getElementById("co-msg");
            var say = function (html) { msg.innerHTML = html; };
            var q = new URLSearchParams(location.search);
            var manage = q.has("manage");
            var plan = q.get("plan");
            if (!manage && plan !== "basic" && plan !== "pro") { say('Pick a plan on the <a class="link" href="/pricing">pricing page</a>.'); return; }
            if (manage) say("Opening billing…");
            // The plan belongs to an account, so the buyer logs in first.
            if (!(typeof getAuthTokens === "function" && getAuthTokens())) {
              say('Log in first so the plan goes on your account. <a class="link" href="/account">Log in</a>');
              return;
            }
            try {
              var out = await authedFetch(manage ? "/me/billing" : "/me/checkout", { method: "POST", body: JSON.stringify(manage ? {} : { plan: plan }) });
              location.href = out.url;
            } catch (e) {
              say((e && e.message ? e.message : "Couldn't open checkout.") + ' <a class="link" href="' + location.href + '">Try again</a>');
            }
          });
        </script>
