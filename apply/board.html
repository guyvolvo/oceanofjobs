<!doctype html>
<html lang="en" data-mode="dark">
<head>
  <!-- site-head -->
  <title>Tech Job Board | Ocean of Jobs</title>
  <meta name="description" content="Job board listing jobs from company hiring pages." />
  <!-- app.js swaps this for /job/<id> while a job is open (store.ts setCanonical). -->
  <link rel="canonical" href="https://oceanofjobs.com/board" id="canonical" />
  <link rel="alternate" type="application/rss+xml" title="Ocean of Jobs newest jobs" href="https://oceanofjobs.com/feed.xml" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://oceanofjobs.com/board" />
  <meta property="og:title" content="OceanOfJobs.com" />
  <meta property="og:description" content="Job board listing jobs from company hiring pages." />
  <meta property="og:image" content="https://oceanofjobs.com/og.jpg?v=3" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="OceanOfJobs.com" />
  <meta name="twitter:description" content="Job board listing jobs from company hiring pages." />
  <meta name="twitter:image" content="https://oceanofjobs.com/og.jpg?v=3" />
  <!-- The precomputed first page (loader/bootstrap.py), fetched alongside the scripts. -->
  <link rel="preload" href="/bootstrap.json" as="fetch" crossorigin="anonymous" />
  <link rel="preload" href="/fonts/SourceSans3-VF-latin.woff2" as="font" type="font/woff2" crossorigin />
</head>
<body>
  <!-- Prerendered at build time (scripts/prerender.mjs), then hydrated. -->
  <div id="root" data-page="board"></div>
  <script type="module" src="/src/board/main.tsx"></script>
  <!-- The outage badge (styled in src/board/board.css). -->
  <script src="/upstream.js" defer></script>
</body>
</html>
