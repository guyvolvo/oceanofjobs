<!doctype html>
<html lang="en" data-mode="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#17181c" />
  <title>Auto apply | Ocean of Jobs</title>
  <meta name="description" content="Your auto apply queue, application history and settings." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=3" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png?v=3" />
  <link rel="preload" href="/fonts/Geist-400-latin.woff2" as="font" type="font/woff2" crossorigin />
  <!-- The site's theme choice, before anything paints. Dark unless the
       reader picked light, the same rule every other page uses. -->
  <script>
    (function () {
      var light = false;
      try { light = localStorage.getItem("iljobs_theme") === "light"; } catch (e) {}
      document.documentElement.setAttribute("data-mode", light ? "light" : "dark");
      document.querySelector('meta[name="theme-color"]').content = light ? "#f2f0ef" : "#17181c";
    })();
  </script>
  <!-- The site's own sign-in state and token refresh (getAuthTokens,
       cognitoRequest, signOut). The app calls these globals instead of
       keeping a second copy of the Cognito details. -->
  <script src="/auth.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
